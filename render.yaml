services:
  - type: web
    name: gsp-api
    runtime: node
    plan: free
    region: singapore
    branch: master
    healthCheckPath: /api/v1/health
    # Root stays the repo root (not apps/api) — this is an npm workspaces monorepo, so
    # install/build must run from the workspace root to resolve the shared lockfile.
    # --include=dev: Render sets NODE_ENV=production during the build too, which makes
    # plain `npm ci` omit devDependencies — but the TS build needs typescript, prisma,
    # and every @types/* package, none of which are needed at runtime.
    # db:migrate:deploy runs with PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK=true. Even routed
    # through DIRECT_DATABASE_URL, real builds still hit P1002 (advisory-lock acquisition,
    # hard-coded 10s timeout, not configurable) on every one of 3 retries spaced ~90s
    # apart — ruling out a simple cold-start/timing fluke. Root cause: Prisma doesn't
    # reliably release this lock when a migrate run fails/is killed (prisma/prisma#12999),
    # so a stuck session from one failed build blocks every subsequent attempt until
    # Postgres independently notices the dead connection, which is what made "Clear cache
    # and rebuild" (slower, more elapsed time between manual attempts) look like a fix
    # when it was really just waiting it out. Disabling the lock removes the failure mode
    # entirely; the coordination it exists for (two migrations racing on the same schema)
    # can't happen here — Render only ever runs one build at a time for this service, and
    # there's a single developer. The retry wrapper stays as a harmless safety net for
    # unrelated transient network blips.
    buildCommand: npm ci --include=dev && npm run db:generate --workspace=apps/api && (PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK=true npm run db:migrate:deploy --workspace=apps/api || (sleep 15 && PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK=true npm run db:migrate:deploy --workspace=apps/api) || (sleep 30 && PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK=true npm run db:migrate:deploy --workspace=apps/api)) && npm run build --workspace=apps/api
    startCommand: npm run start --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; env.ts already defaults/reads it.
      - key: DATABASE_URL
        sync: false
      # Direct (unpooled) Neon URL — same as DATABASE_URL with `-pooler` dropped from the
      # host. Used by Prisma Migrate only; the runtime keeps the pooled DATABASE_URL above.
      # Without this, `migrate deploy` fails the build with P1002 (advisory lock timeout),
      # because Neon's pooler is transaction-mode and can't hold a session-level lock.
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 3h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Set to the deployed Vercel URL, e.g. https://gsp-mis.vercel.app (no trailing slash).
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_SIGNUP_KEY
        sync: false
      # Preferred email path on Render — see apps/api/.env.example for one-time setup.
      # Sends over HTTPS as a real Gmail account, so it isn't subject to the free plan's
      # outbound-SMTP restrictions and can reach any recipient (unlike Mailtrap's shared
      # sending domain below).
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Same value as CORS_ORIGINS — used to build links inside outgoing emails.
      - key: WEB_APP_URL
        sync: false
