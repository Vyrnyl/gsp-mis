services:
  - type: web
    name: gsp-api
    runtime: node
    plan: free
    region: singapore
    branch: master
    healthCheckPath: /api/v1/health
    # Root stays the repo root (not apps/api) — this is an npm workspaces monorepo, so
    # install/build must run from the workspace root to resolve the shared lockfile.
    # --include=dev: Render sets NODE_ENV=production during the build too, which makes
    # plain `npm ci` omit devDependencies — but the TS build needs typescript, prisma,
    # and every @types/* package, none of which are needed at runtime.
    # db:migrate:deploy is wrapped in two retries (15s, then 30s backoff). Even routed
    # through DIRECT_DATABASE_URL, Prisma Migrate's advisory-lock acquisition has a
    # hard-coded, non-configurable 10s timeout (P1002), and Neon's compute can cold-start
    # from autosuspend on the very connection Migrate opens — eating enough of that 10s
    # budget to fail even when nothing is actually contending for the lock. Confirmed
    # intermittent in practice: a plain redeploy would fail here while a from-scratch
    # "Clear cache and rebuild" (slower, more elapsed time before this step runs) would
    # pass on the same commit. Retrying in place removes the need to rely on that timing
    # accident.
    buildCommand: npm ci --include=dev && npm run db:generate --workspace=apps/api && (npm run db:migrate:deploy --workspace=apps/api || (sleep 15 && npm run db:migrate:deploy --workspace=apps/api) || (sleep 30 && npm run db:migrate:deploy --workspace=apps/api)) && npm run build --workspace=apps/api
    startCommand: npm run start --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; env.ts already defaults/reads it.
      - key: DATABASE_URL
        sync: false
      # Direct (unpooled) Neon URL — same as DATABASE_URL with `-pooler` dropped from the
      # host. Used by Prisma Migrate only; the runtime keeps the pooled DATABASE_URL above.
      # Without this, `migrate deploy` fails the build with P1002 (advisory lock timeout),
      # because Neon's pooler is transaction-mode and can't hold a session-level lock.
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 3h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Set to the deployed Vercel URL, e.g. https://gsp-mis.vercel.app (no trailing slash).
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_SIGNUP_KEY
        sync: false
      # Preferred email path on Render — see apps/api/.env.example for one-time setup.
      # Sends over HTTPS as a real Gmail account, so it isn't subject to the free plan's
      # outbound-SMTP restrictions and can reach any recipient (unlike Mailtrap's shared
      # sending domain below).
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Same value as CORS_ORIGINS — used to build links inside outgoing emails.
      - key: WEB_APP_URL
        sync: false
